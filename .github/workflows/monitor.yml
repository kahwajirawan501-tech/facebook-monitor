name: Facebook Early-Alert Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: facebook-monitor
  cancel-in-progress: true

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run one monitoring cycle
        env:
          RUN_ONCE: "true"
          # إعدادات السكرول: كمل سكرول لحد ما يوصل لآخر منشور جديد فعلاً،
          # مش يوقف بسرعة لمجرد إنو فيسبوك تأخر بالتحميل لحظة وحدة.
          MAX_SCROLL_PASSES: "30"
          SCROLL_EMPTY_PASS_TOLERANCE: "10"
          SCROLL_PRESSES_PER_PASS: "3"
          SCROLL_WAIT_MS: "3500"
          # تشخيص مؤقت — بيلتقط سكرين شوت من الصفحة زي ما فيسبوك رجعها فعلياً
          DEBUG_SCREENSHOT: "true"
          # تشخيص مؤقت — بيحفظ الـ HTML الخام للصفحة بعد السكرول (عشان نعرف
          # بنية الـ DOM الحقيقية للمنشورات اليوم ونصلّح الـ selectors عليها)
          DEBUG_HTML: "true"
          # تشخيص مؤقت — بيراقب طلبات GraphQL (تحميل المزيد) أثناء السكرول
          DEBUG_NETWORK: "true"
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_URLS: ${{ secrets.TARGET_URLS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FB_AUTH_STATE_JSON: ${{ secrets.FB_AUTH_STATE_JSON }}
        # التعديل هنا لتشغيل الـ main.py الجديد
        run: python main.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            downloads/debug_*.png
            downloads/debug_*.html
          if-no-files-found: ignore
          retention-days: 3
