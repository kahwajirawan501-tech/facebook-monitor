name: Facebook Early-Alert Monitor

on:
  schedule:
    # 5 دقائق هو الحد الأدنى الفعلي الذي تنفّذه GitHub بثبات — أي رقم أقل
    # سيُخفَّض تلقائيًا إلى 5 دقائق من جهة GitHub، مع خطر تأخير/تخطي تشغيلات.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # يسمح بتشغيل يدوي من تبويب Actions للاختبار

# يمنع تراكم تشغيلات متوازية إذا تأخرت إحداها
concurrency:
  group: facebook-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4   # أقل بوضوح من الفاصل الزمني (5 دقائق) حتى لا تتراكم التشغيلات أبدًا

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # يخزّن متصفح Chromium الخاص بـ Playwright بين التشغيلات بدل تحميله من الصفر
      # كل مرة (كان يستغرق ~1-2 دقيقة وحده). المفتاح مرتبط بنظام التشغيل + رقم إصدار
      # Playwright، فيتجدد تلقائيًا فقط عند تغيّر الإصدار.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium
        # إن كان الكاش موجودًا بالفعل، هذا الأمر يتحقق فقط ولا يعيد التحميل الكامل

      - name: Run one monitoring cycle
        env:
          RUN_ONCE: "true"
          TARGET_URLS: ${{ secrets.TARGET_URLS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python facebook_monitor.py
